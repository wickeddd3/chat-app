name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "chat-app-backend/**" # Only trigger if backend code changes
  pull_request:
    branches:
      - main
    paths:
      - "chat-app-backend/**"
  workflow_dispatch: # Allow manual triggering from GitHub UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Define variables here once for all steps
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "./chat-app-backend/package-lock.json"

      - name: Install Dependencies
        run: |
          cd chat-app-backend
          npm ci

      - name: Build Check
        run: |
          cd chat-app-backend
          npm run build
        env:
          # `npm run build` runs prisma generate (+ tsc + tsc-alias). Prisma
          # resolves DATABASE_URL from prisma.config.ts but does not connect at
          # generate/compile time, so a placeholder is sufficient here. The real
          # URL is injected at runtime by the deploy target (Render).
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Deploy to Render
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Render provides a "Deploy Hook" URL in your service settings
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
