name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "chat-app-frontend/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "chat-app-frontend/package-lock.json"

      - name: Install Frontend Dependencies
        run: |
          cd chat-app-frontend
          npm ci

      - name: Install Vercel CLI Globally
        run: npm install --global vercel

      # 1. Pull Vercel configurations so the runner knows your project ID mappings
      - name: Pull Vercel Environment Context
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }} --cwd ./chat-app-frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # 2. Build your Vite project natively inside the GitHub Runner
      # This bakes your GitHub repository secrets directly into the compiled JavaScript
      - name: Build Vite Production Artifacts
        run: |
          cd chat-app-frontend
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # 3. Structure Vite's output into Vercel's required deployment format
      - name: Prepare Vercel Prebuilt Directory
        run: |
          mkdir -p chat-app-frontend/.vercel/output
          cp -R chat-app-frontend/dist/* chat-app-frontend/.vercel/output/

      # 4. Force Production Deploy directly to Vercel using the prebuilt assets
      - name: Deploy to Vercel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd ./chat-app-frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
