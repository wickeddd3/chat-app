# Render Blueprint (Infrastructure as Code) for the chat-app backend.
#
# Docker runtime — the multi-stage Dockerfile is the single build definition,
# shared with docker-compose (which builds the `development` stage). Render
# builds the Dockerfile's final `production` stage by default:
#   - `build` stage runs a full `npm ci` (dev deps included) and compiles TS,
#     so NODE_ENV=production never breaks the build.
#   - `production` stage installs runtime deps only and copies `dist/`.
#
# NOTE: a Blueprint does NOT retroactively take over a service created manually
# in the dashboard. For a dashboard-created Docker service, set the same
# Dockerfile Path / Docker Build Context in its Settings instead.
services:
  - type: web
    name: chat-app-backend
    runtime: docker
    dockerfilePath: ./chat-app-backend/Dockerfile
    dockerContext: ./chat-app-backend
    healthCheckPath: /health
    autoDeploy: false # Deploys are triggered by the GitHub Actions deploy hook.
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # PORT is injected automatically by Render; the app reads it from env and
      # the Dockerfile HEALTHCHECK honors it.
      # Secrets — set these in the Render dashboard (never committed):
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
